<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SagaFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-primary);
      transition: background-color 0.5s ease, color 0.5s ease;
      /* Prevent rubber-banding on iOS */
      overscroll-behavior-y: none;
      /* Remove grey highlight on tap for mobile */
      -webkit-tap-highlight-color: transparent;
      /* Smoother scrolling on iOS */
      -webkit-overflow-scrolling: touch;
    }

    /* Selection colors for better aesthetics */
    ::selection {
      background-color: var(--color-accent);
      color: #ffffff;
    }

    /* Prevent iOS text size adjustment and auto-zoom on inputs */
    @media screen and (max-width: 768px) {

      input,
      textarea,
      select,
      button {
        font-size: 16px !important;
      }
    }

    /* REPLACED SPACE GROTESK WITH OUTFIT (MODERN DISPLAY STYLE) */
    .font-display {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
      /* Tight tracking for modern look */
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* --- SAGA FLOW: ETHEREAL SANCTUARY PALETTE (LIQUID GLASS ADJUSTMENTS) --- */
    /* NOTE: Borders are now extremely subtle (opacity 0.05 - 0.1) to reduce visual noise */

    body.theme-dark {
      /* "Starfall" - Deep, safe indigos and bioluminescent violets */
      --color-bg: #0f0a1e;
      --color-text-primary: #e9d5ff;
      --color-text-secondary: #c4b5fd;
      --color-text-muted: #8b5cf6;

      /* LIQUID GLASS: High transparency for backdrop blur to work */
      --color-card-bg: rgba(20, 15, 40, 0.4);
      --color-input-bg: rgba(255, 255, 255, 0.03);

      --color-border: rgba(255, 255, 255, 0.08);
      /* Ultra subtle border */

      --color-accent: #a78bfa;
      --color-accent-hover: #c084fc;
      --color-accent-strong: #7c3aed;

      --color-header-gradient-from: #c084fc;
      --color-header-gradient-via: #f472b6;
      --color-header-gradient-to: #fbbf24;

      --color-button-gradient-from: #6d28d9;
      --color-button-gradient-to: #4c1d95;
      --color-button-gradient-from-hover: #7c3aed;
      --color-button-gradient-to-hover: #5b21b6;

      --color-destructive: #f87171;
      --color-destructive-hover: #ef4444;
      --color-destructive-bg: rgba(127, 29, 29, 0.2);

      /* Ambient Orbs */
      --color-ambient-1: #5b21b6;
      --color-ambient-2: #be185d;
      --color-ambient-3: #1e40af;
    }

    body.theme-light {
      /* "Daydream" - Soft lilacs, creamy whites, airy atmosphere */
      --color-bg: #f8f7ff;
      --color-text-primary: #2e1065;
      --color-text-secondary: #5b21b6;
      --color-text-muted: #8b5cf6;

      /* LIQUID GLASS: Milky white transparency */
      --color-card-bg: rgba(255, 255, 255, 0.5);
      --color-input-bg: rgba(255, 255, 255, 0.6);

      --color-border: rgba(46, 16, 101, 0.06);
      /* Very subtle dark border for light mode */

      --color-accent: #9333ea;
      --color-accent-hover: #7e22ce;
      --color-accent-strong: #6b21a8;

      --color-header-gradient-from: #9333ea;
      --color-header-gradient-via: #d946ef;
      --color-header-gradient-to: #f59e0b;

      --color-button-gradient-from: #c084fc;
      --color-button-gradient-to: #a855f7;
      --color-button-gradient-from-hover: #d8b4fe;
      --color-button-gradient-to-hover: #c084fc;

      --color-destructive: #fb7185;
      --color-destructive-hover: #f43f5e;
      --color-destructive-bg: #fff1f2;

      --color-ambient-1: #e9d5ff;
      --color-ambient-2: #fbcfe8;
      --color-ambient-3: #bfdbfe;
    }

    body.theme-mystic {
      /* "Astral Plane" - High contrast neon fantasy */
      --color-bg-image: radial-gradient(circle at center, #1e1b4b, #020617);
      --color-bg: #020617;
      --color-text-primary: #ffffff;
      --color-text-secondary: #a5b4fc;
      --color-text-muted: #6366f1;

      /* LIQUID GLASS: Dark crystal */
      --color-card-bg: rgba(15, 23, 42, 0.4);
      --color-input-bg: rgba(255, 255, 255, 0.05);

      --color-border: rgba(255, 255, 255, 0.1);

      --color-accent: #38bdf8;
      --color-accent-hover: #7dd3fc;
      --color-accent-strong: #0ea5e9;

      --color-header-gradient-from: #22d3ee;
      --color-header-gradient-via: #818cf8;
      --color-header-gradient-to: #e879f9;

      --color-button-gradient-from: #4f46e5;
      --color-button-gradient-to: #06b6d4;
      --color-button-gradient-from-hover: #4338ca;
      --color-button-gradient-to-hover: #0891b2;

      --color-destructive: #fca5a5;
      --color-destructive-hover: #f87171;
      --color-destructive-bg: rgba(153, 27, 27, 0.3);

      --color-ambient-1: #4338ca;
      --color-ambient-2: #0891b2;
      --color-ambient-3: #701a75;
    }

    body.theme-mystic {
      background-image: var(--color-bg-image);
      background-attachment: fixed;
    }

    .gradient-button {
      background-image: linear-gradient(to right, var(--color-button-gradient-from), var(--color-button-gradient-to));
    }

    .gradient-button:hover:not(:disabled) {
      background-image: linear-gradient(to right, var(--color-button-gradient-from-hover), var(--color-button-gradient-to-hover));
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-border);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-accent);
    }

    /* Mobile Helpers */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    .h-safe {
      min-height: -webkit-fill-available;
    }
  </style>
